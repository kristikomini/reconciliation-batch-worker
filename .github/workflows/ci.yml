name: ci
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build (warnings are errors)
        run: dotnet build --configuration Release --no-restore
      # CI=true is set by GitHub Actions, so the Testcontainers SQL Server integration tests run
      # here (Docker is available on the runner); locally they skip unless RUN_DB_TESTS=1.
      - name: Test
        run: dotnet test --configuration Release --no-build
